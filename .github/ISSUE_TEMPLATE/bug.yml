name: Bug report
description: 报告可复现的游戏或工程缺陷
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 实际发生了什么？影响是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: "1. 新建游戏\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或 commit
      placeholder: "0.4.0-dev / fc09f48"
  - type: textarea
    id: evidence
    attributes:
      label: 日志、截图或存档信息
      description: 不要粘贴 API key 或私人数据。
  - type: dropdown
    id: severity
    attributes:
      label: 严重度
      options:
        - P0 无法启动/存档损坏/主线阻塞
        - P1 核心玩法错误但有绕过方式
        - P2 一般体验或表现问题
    validations:
      required: true
