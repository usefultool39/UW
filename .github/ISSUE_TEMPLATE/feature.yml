name: Feature proposal
description: 提议一个可验收的玩家或工程能力
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 说明谁在什么场景遇到什么问题。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与非目标
      placeholder: "包含：\n不包含："
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 依赖、风险与参考
