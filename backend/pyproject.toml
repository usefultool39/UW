[tool.poetry]
name = "border-echo-backend"
version = "0.1.0"
description = "边境回声 · 单人 AI RPG 纵切 Demo 后端"
authors = ["Border Echo Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.110"
uvicorn = {extras = ["standard"], version = ">=0.27"}
pydantic = ">=2"
httpx = ">=0.27"
python-dotenv = ">=1.0"
anthropic = ">=0.32"
slowapi = ">=0.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"

[tool.pytest.ini_options]
cache_dir = "_test_tmp/.pytest_cache"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
