[tool.poetry]
name = "30town-backend"
version = "0.1.0"
description = "30小镇 · 双人砍树 MVP 后端"
authors = ["30小镇 Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.110"
uvicorn = {extras = ["standard"], version = ">=0.27"}
pydantic = ">=2"
httpx = ">=0.27"
python-dotenv = ">=1.0"
anthropic = ">=0.32"
slowapi = ">=0.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
